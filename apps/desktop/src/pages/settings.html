<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Jemma Desktop settings</title>
<link rel="stylesheet" href="plain.css">
</head>
<body>
<!-- TODO(design): replace with the desktop boards (settings screen). Plain placeholder, no styling beyond layout. -->
<h1>Jemma Desktop</h1>
<p id="status">Loading</p>

<h2>AI agent</h2>
<ul id="agents">
  <li><label><input type="radio" name="agent" value="claude"> Claude Code</label> <span id="claude-status"></span></li>
  <li><label><input type="radio" name="agent" value="codex"> Codex</label> <span id="codex-status"></span></li>
</ul>

<h2>Account</h2>
<p id="account">Not paired</p>
<p>
  <button id="pair-self">Pair this Mac</button>
  <button id="unpair">Unpair</button>
</p>
<p>
  <label for="code">Or enter the pairing code shown on the web</label>
  <input id="code" maxlength="6" autocomplete="off">
  <button id="pair-code">Pair</button>
</p>
<p id="pair-message"></p>

<h2>Running</h2>
<p><label><input type="checkbox" id="paused"> Pause</label></p>
<p><button id="open-web">Open Jemma</button></p>
<script src="settings.js"></script>
</body>
</html>
