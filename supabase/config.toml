# The local Supabase stack for Jemma. `./start.sh` runs `supabase start` with this file.
# The migrations in supabase/migrations build the whole database, including the four storage buckets,
# so there is no seed file: the demo school is made by the app itself (/demo).
# Ports are the Supabase defaults. Only what Jemma uses is switched on, so the first start downloads less.
project_id = "jemma-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

# Not used by Jemma: left off.
[realtime]
enabled = false

[studio]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

# Mail the local auth server sends can be read at http://127.0.0.1:54324.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
