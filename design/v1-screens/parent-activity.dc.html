<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent · Add an activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FA}
*{box-sizing:border-box}
a{color:#1F1D36}a:hover{color:#B8381F}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:904px;background:#F7F7FA;font-family:Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif;color:#1F1D36;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:4px;padding:10px 16px 6px 8px">
    <a href="parent-profile.dc.html" aria-label="Back to profile" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#1F1D36">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <span style="display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0">
      <span style="font-size:13px;color:#5D5A73">Amina</span>
      <span style="font-size:17px;font-weight:700">Add an activity</span>
    </span>
  </header>

  <main style="flex:1;display:flex;flex-direction:column;gap:20px;padding:12px 20px 24px;min-height:0">
    <h1 style="margin:0;font-size:27px;line-height:1.18;font-weight:700;letter-spacing:-0.015em;text-wrap:pretty">What does Amina do outside class?</h1>

    <form style="display:flex;flex-direction:column;gap:20px">
      <fieldset style="border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">
        <legend style="padding:0;margin-bottom:10px;font-size:15px;font-weight:500">Kind</legend>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:15px;font-weight:500">Sport</button>
          <button type="button" aria-pressed="true" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:none;background:#1F1D36;color:#FFFFFF;font-size:15px;font-weight:500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Club</button>
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:15px;font-weight:500">Music</button>
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:15px;font-weight:500">Art</button>
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:15px;font-weight:500">Something else</button>
        </div>
      </fieldset>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="aname" style="font-size:15px;font-weight:500">What is it called?</label>
        <input id="aname" type="text" value="Chess club" style="height:52px;padding:0 16px;border-radius:14px;border:2px solid #1F1D36;background:#FFFFFF;color:#1F1D36;font-size:17px">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="awhere" style="font-size:15px;font-weight:500">Where <span style="color:#5D5A73;font-weight:400">(optional)</span></label>
        <input id="awhere" type="text" value="Hillview Primary, after school" style="height:52px;padding:0 16px;border-radius:14px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:17px">
      </div>

      <fieldset style="border:none;margin:0;padding:0">
        <legend style="padding:0;margin-bottom:10px;font-size:15px;font-weight:500">Which days?</legend>
        <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));gap:6px">
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Mon</button>
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Tue</button>
          <button type="button" aria-pressed="true" style="height:46px;border-radius:12px;border:none;background:#1F1D36;color:#FFFFFF;font-size:14px;font-weight:600">Wed</button>
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Thu</button>
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Fri</button>
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Sat</button>
          <button type="button" aria-pressed="false" style="height:46px;border-radius:12px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:14px;font-weight:600">Sun</button>
        </div>
      </fieldset>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="asince" style="font-size:15px;font-weight:500">Since when?</label>
        <select id="asince" style="height:52px;padding:0 14px;border-radius:14px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:17px">
          <option>This term</option>
          <option>Last term</option>
          <option>This year</option>
          <option>Longer</option>
        </select>
      </div>
    </form>

    <p style="margin:0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#EEEDF5;font-size:14px;line-height:1.45">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
      Ms Banda sees activities on Amina's profile. Jemma uses them in the guidance card, never to mark her.
    </p>

    <div style="flex:1"></div>
    <a href="parent-profile.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;background:#1F1D36;color:#FFFFFF;font-size:17px;font-weight:600;text-decoration:none">Save activity</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":904}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
