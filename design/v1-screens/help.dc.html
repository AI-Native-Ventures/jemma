<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FA}
*{box-sizing:border-box}
a{color:#1F1D36}a:hover{color:#B8381F}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width:390px;height:924px;background:#F7F7FA;font-family:Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif;color:#1F1D36;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <header style="display:flex;align-items:center;gap:4px;padding:10px 12px 6px 8px">
    <a href="parent-account.dc.html" aria-label="Back to your account" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#1F1D36">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <span style="display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0;color:#1F1D36">
      <span style="font-size:17px;font-weight:700">Help</span>
    </span>
  </header>

  <main style="flex:1;display:flex;flex-direction:column;gap:18px;padding:12px 20px 28px;min-height:0">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;margin-top:10px"><polygon points="8,0.5 15.5,8 8,15.5 0.5,8" fill="#FF6A4D"/></svg>
        <h1 style="margin:0;font-size:27px;line-height:1.18;font-weight:600;letter-spacing:-0.015em;text-wrap:pretty">How can we help?</h1>
      </div>
    </div>

    <div style="position:relative">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Search help</label>
      <span style="position:absolute;left:14px;top:15px;color:#5D5A73"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg></span>
      <input id="q" type="search" placeholder="Search help" style="width:100%;height:52px;padding:0 14px 0 46px;border-radius:14px;border:1px solid #8C89A3;background:#FFFFFF;color:#1F1D36;font-size:17px">
    </div>

    <section aria-labelledby="popular" style="display:flex;flex-direction:column;gap:4px;padding:16px;background:#FFFFFF;border:1px solid #E7E6EF;border-radius:20px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2 id="popular" style="margin:0;font-size:17px;font-weight:600">Popular questions</h2>
        </div>
      </div>
      <ul style="list-style:none;margin:0;padding:0">
        <li style="">
          <button type="button" aria-expanded="true" aria-controls="a1" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:none;background:transparent;color:#1F1D36;text-align:left;font-size:16px;font-weight:600"><span style="flex:1">Why did Jemma mark this wrong?</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m6 15 6-6 6 6"/></svg></button>
          <p id="a1" style="margin:0 0 14px;padding:12px 14px;border-radius:14px;background:#F4F3F8;font-size:15px;line-height:1.5">Tap the mark to see the photo it came from. If Jemma read it wrong, tell the teacher from the paper.</p>
        </li>
        <li style="border-top:1px solid #EFEEF4;">
          <button type="button" aria-expanded="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:none;background:transparent;color:#1F1D36;text-align:left;font-size:16px;font-weight:500"><span style="flex:1">Who can see my child's marks?</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m6 9 6 6 6-6"/></svg></button>
        </li>
        <li style="border-top:1px solid #EFEEF4;">
          <button type="button" aria-expanded="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:none;background:transparent;color:#1F1D36;text-align:left;font-size:16px;font-weight:500"><span style="flex:1">Why does it say too early to tell?</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m6 9 6 6 6-6"/></svg></button>
        </li>
        <li style="border-top:1px solid #EFEEF4;">
          <button type="button" aria-expanded="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:none;background:transparent;color:#1F1D36;text-align:left;font-size:16px;font-weight:500"><span style="flex:1">How do I fix a mark? (teachers)</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m6 9 6 6 6-6"/></svg></button>
        </li>
        <li style="border-top:1px solid #EFEEF4;">
          <button type="button" aria-expanded="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 0;border:none;background:transparent;color:#1F1D36;text-align:left;font-size:16px;font-weight:500"><span style="flex:1">How do I reset the demo?</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m6 9 6 6 6-6"/></svg></button>
        </li>
      </ul>
    </section>

    <section aria-labelledby="stuck" style="display:flex;flex-direction:column;gap:12px;padding:16px;background:#FFFFFF;border:1px solid #E7E6EF;border-radius:20px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2 id="stuck" style="margin:0;font-size:17px;font-weight:600">Still stuck?</h2>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:1.5px solid #1F1D36;background:#FFFFFF;color:#1F1D36;font-size:16px;font-weight:600">Report a problem</button>
        <button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;border:1.5px solid #1F1D36;background:#FFFFFF;color:#1F1D36;font-size:16px;font-weight:600">Message the Jemma team</button>
      </div>
      <p style="margin:0;font-size:14px;color:#5D5A73">We answer within one school day.</p>
    </section>
    <div style="flex:1"></div>
  </main>
</div>
