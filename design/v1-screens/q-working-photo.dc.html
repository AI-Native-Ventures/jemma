<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neo · Question type: snap your working</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7FA}
*{box-sizing:border-box}
a{color:#1F1D36}a:hover{color:#B8381F}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F7F7FA;font-family:Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif;color:#1F1D36;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <header style="display:flex;align-items:center;gap:8px;padding:10px 18px 6px 8px">
    <a href="teen-today.dc.html" aria-label="Stop for now" style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#1F1D36">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <ol aria-label="Session steps" style="flex:1;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:6px">
      <li style="display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:#5D5A73"><span aria-hidden="true" style="height:6px;border-radius:999px;background:#1F1D36"></span>Warm-up</li>
      <li style="display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:#5D5A73"><span aria-hidden="true" style="height:6px;border-radius:999px;background:#1F1D36"></span>Learn</li>
      <li aria-current="step" style="display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#1F1D36"><span aria-hidden="true" style="height:6px;border-radius:999px;background:#FF6A4D"></span>Try</li>
      <li style="display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:#6A6782"><span aria-hidden="true" style="height:6px;border-radius:999px;background:#E3E1EE"></span>Results</li>
    </ol>
  </header>

  <main style="flex:1;display:flex;flex-direction:column;gap:18px;padding:18px 20px 26px;min-height:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <p style="margin:0;font-size:16px;font-weight:600">Question 5 · your working</p>
        <p style="margin:0;font-size:13px;color:#5D5A73">Trigonometry · cosine rule</p>
      </div>
      <span aria-hidden="true" style="display:flex;gap:6px"><span style="width:11px;height:11px;border-radius:999px;background:#1F1D36"></span><span style="width:11px;height:11px;border-radius:999px;background:#1F1D36"></span><span style="width:11px;height:11px;border-radius:999px;background:#1F1D36"></span><span style="width:11px;height:11px;border-radius:999px;background:#1F1D36"></span><span style="width:11px;height:11px;border-radius:999px;border:3px solid #FF6A4D"></span></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <h1 style="margin:0;font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-0.01em">Show your working for question 5</h1>
      <span style="align-self:flex-start;padding:3px 10px;border-radius:999px;background:#EEEDF5;font-size:13px;font-weight:600">Optional</span>
    </div>
    <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
      <div aria-hidden="true" style="position:relative;height:300px;border-radius:22px;background:#2A2622;box-shadow:inset 0 0 60px rgba(0,0,0,0.5);overflow:hidden">
        <div style="position:absolute;left:30px;right:30px;top:40px;height:220px;background:#FBFAF5;transform:rotate(-1.4deg);box-shadow:0 10px 24px rgba(0,0,0,0.35);padding:16px 12px 0 26px;border-left:2px solid #E7A9A0">
          <span style="display:block;font-family:Arial, Helvetica, sans-serif;font-size:11px;color:#5D5A73;padding-bottom:4px">5.</span>
          <span style="display:block;height:38px;border-bottom:1px solid #C9D3E6;padding:9px 0 0 6px;font-family:Kalam, 'Comic Sans MS', cursive;color:#2F3A56;font-size:16px;line-height:1.2;white-space:nowrap">PR² = 8² + 11² − 2(8)(11) cos 52°</span><span style="display:block;height:38px;border-bottom:1px solid #C9D3E6;padding:6px 0 0 6px;font-family:Kalam, 'Comic Sans MS', cursive;color:#2F3A56;font-size:21px;line-height:1.2;white-space:nowrap">PR² = 76,64</span><span style="display:block;height:38px;border-bottom:1px solid #C9D3E6;padding:6px 0 0 6px;font-family:Kalam, 'Comic Sans MS', cursive;color:#2F3A56;font-size:21px;line-height:1.2;white-space:nowrap">PR = 8,75</span><span style="display:block;height:38px;border-bottom:1px solid #C9D3E6;padding:6px 0 0 6px;font-family:Kalam, 'Comic Sans MS', cursive;color:#2F3A56;font-size:21px;line-height:1.2;white-space:nowrap">PR = 8,8 cm</span>
        </div>
        <span style="position:absolute;left:14px;top:14px;width:30px;height:30px;border-left:4px solid #FF6A4D;border-top:4px solid #FF6A4D;border-top-left-radius:10px"></span><span style="position:absolute;right:14px;top:14px;width:30px;height:30px;border-right:4px solid #FF6A4D;border-top:4px solid #FF6A4D;border-top-right-radius:10px"></span><span style="position:absolute;left:14px;bottom:14px;width:30px;height:30px;border-left:4px solid #FF6A4D;border-bottom:4px solid #FF6A4D;border-bottom-left-radius:10px"></span><span style="position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-right:4px solid #FF6A4D;border-bottom:4px solid #FF6A4D;border-bottom-right-radius:10px"></span>
      </div>
      <figcaption style="font-size:14px;color:#5D5A73">Your photo of question 5, just now</figcaption>
    </figure>
    <p style="margin:0;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;color:#5D5A73">
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="flex:none;margin-top:5px"><polygon points="8,0.5 15.5,8 8,15.5 0.5,8" fill="#FF6A4D"/></svg>
      Jemma reads your working and gives feedback with your results at the end.
    </p>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:16px;border:1.5px solid #1F1D36;background:#FFFFFF;color:#1F1D36;font-size:17px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1D36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>Retake</button>
      <a href="q-results-graph.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;background:#1F1D36;color:#FFFFFF;font-size:17px;font-weight:700;text-decoration:none">Use this photo</a>
    </div>
    <div style="flex:1"></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
