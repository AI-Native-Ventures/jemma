    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-0.015em">Why 1/2 + 1/4 is 3/4</h1>

    <figure style="margin:0;display:flex;flex-direction:column;gap:14px;padding:18px 16px;background:#FFFFFF;border:1px solid #E7E6EF;border-radius:24px">
      <figcaption style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Fraction bars: one half equals two quarters, plus one quarter makes three quarters.</figcaption>

      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="display:flex;gap:8px;font-size:15px;font-weight:600"><span style="width:22px;height:22px;flex:none;border-radius:999px;background:#1F1D36;color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center">1</span>A half and a quarter</span>

          <span aria-hidden="true" style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));height:34px;border:2px solid #1F1D36;border-radius:7px;overflow:hidden"><span style="background:#1F1D36;border-right:2px solid #1F1D36"></span><span style="border-right:2px solid #1F1D36"></span><span style="border-right:2px solid #1F1D36"></span><span></span></span>
        </span>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px dashed #CFCDDC">
        <span style="display:flex;gap:8px;font-size:15px;font-weight:600"><span style="width:22px;height:22px;flex:none;border-radius:999px;background:#1F1D36;color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center">2</span>Cut the half into quarters. Same amount.</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span aria-hidden="true" style="width:34px;display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:17px;font-weight:700"><span style="padding:0 3px 2px">2</span><span style="border-top:2px solid #1F1D36;padding:2px 3px 0">4</span></span>
          <span aria-hidden="true" style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));height:34px;border:2px solid #1F1D36;border-radius:7px;overflow:hidden"><span style="background:#FF6A4D;border-right:1.5px dashed #1F1D36"></span><span style="background:#FF6A4D;border-right:2px solid #1F1D36"></span><span style="border-right:2px solid #1F1D36"></span><span></span></span>
        </span>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px dashed #CFCDDC">
        <span style="display:flex;gap:8px;font-size:15px;font-weight:600"><span style="width:22px;height:22px;flex:none;border-radius:999px;background:#1F1D36;color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center">3</span>Now add the quarters: 2 + 1 = 3</span>
        <span style="display:flex;align-items:center;gap:10px">
          <span aria-hidden="true" style="width:34px;display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:17px;font-weight:700"><span style="padding:0 3px 2px">3</span><span style="border-top:2px solid #1F1D36;padding:2px 3px 0">4</span></span>
          <span aria-hidden="true" style="flex:1;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));height:34px;border:2px solid #1F1D36;border-radius:7px;overflow:hidden"><span style="background:#FF6A4D;border-right:2px solid #1F1D36"></span><span style="background:#FF6A4D;border-right:2px solid #1F1D36"></span><span style="background:#1F1D36;border-right:2px solid #1F1D36"></span><span></span></span>
        </span>
      </div>
    </figure>

    <aside aria-label="Why not 2/6" style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:#FFF4F1;border:1px solid #FFC9BB">

        <span aria-hidden="true" style="width:34px;display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:17px;font-weight:700"><span style="padding:0 3px 2px">2</span><span style="border-top:2px solid #1F1D36;padding:2px 3px 0">6</span></span>
