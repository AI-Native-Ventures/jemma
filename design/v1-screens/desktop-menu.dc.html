<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}

</style>
</helmet>
<div style="width:320px;height:540px;display:flex;flex-direction:column;background:#F7F7FA;font-family:Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif;color:#1F1D36;overflow:hidden">

  </div>

  <section aria-label="Jemma Desktop menu" style="margin:6px 8px 0;display:flex;flex-direction:column;padding:6px;background:#FFFFFF;border:1px solid #E7E6EF;border-radius:12px;box-shadow:0 12px 32px rgba(31,29,54,0.14)">

      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Reading 3 of 5 papers</span><span style="font-size:13px;color:#5D5A73">6B Mathematics · snapped at 15:40</span></span>
      <span aria-hidden="true" style="height:8px;border-radius:999px;background:#E4E3EC;overflow:hidden;display:flex"><span style="width:60%;background:#1F1D36;border-radius:999px"></span></span>
      <span style="font-size:12px;color:#5D5A73">About a minute left</span>
    </div>

    <div aria-hidden="true" style="height:1px;background:#EFEEF4;margin:8px 4px"></div>
    <h2 style="margin:0;padding:2px 8px 4px;font-size:12px;font-weight:600;color:#5D5A73">Earlier today</h2>

      <li style="display:flex;align-items:center;gap:10px;min-height:30px;font-size:14px"><span style="width:38px;flex:none;color:#5D5A73;font-variant-numeric:tabular-nums">14:14</span><span>Planned tonight's lessons, 5 learners</span></li>

      <li style="display:flex;align-items:center;gap:10px;min-height:30px;font-size:14px"><span style="width:38px;flex:none;color:#5D5A73;font-variant-numeric:tabular-nums">14:12</span><span>Read 5 papers, 1 unsure</span></li>
    </ol>

    <div aria-hidden="true" style="height:1px;background:#EFEEF4;margin:8px 4px"></div>
    <button type="button" style="display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 8px;border:none;border-radius:7px;background:transparent;color:#1F1D36;font-size:14px;font-weight:500;text-align:left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5.5v13M15 5.5v13"/></svg>Pause Jemma</button>
    <a href="desktop-main.dc.html" style="display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:7px;color:#1F1D36;font-size:14px;font-weight:500;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17"/></svg>Open Jemma</a>

    <div aria-hidden="true" style="height:1px;background:#EFEEF4;margin:8px 4px"></div>
    <button type="button" style="display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 8px;border:none;border-radius:7px;background:transparent;color:#1F1D36;font-size:14px;font-weight:500;text-align:left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v8"/><path d="M7 6.5a7 7 0 1 0 10 0"/></svg>Quit Jemma Desktop</button>
  </section>
</div>
